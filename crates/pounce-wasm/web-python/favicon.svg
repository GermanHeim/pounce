<?xml version="1.0" encoding="UTF-8"?>
<!-- The interior of the O from logos/pounce-transparent.svg: contours, the two
     constraint cuts, and the interior-point iterates converging on the boundary
     solution. The wordmark itself is unreadable at 16 px; this part is not. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="POUNCE">
<defs>
      <clipPath id="ipm-interior-clip">
        <path d="M 390 470 L 535 408 L 535 610 L 365 610 L 365 575 L 378 480 Z"/>
      </clipPath>
    </defs>
<rect width="256" height="256" rx="52" fill="#0D0D0D"/>
<g transform="translate(-268.53,-320.52) scale(0.8812)">
<g id="ipm-constrained-symbol" aria-label="Constrained IPM contours, feasible region, and boundary solution">
    <!-- Clear only the previous interior mark while preserving the O and diagonal cuts. -->
    <path d="M 390 470 L 535 408 L 535 610 L 365 610 L 365 575 L 378 480 Z"
          fill="#0D0D0D"/>

    <defs>
      <clipPath id="ipm-interior-clip">
        <path d="M 390 470 L 535 408 L 535 610 L 365 610 L 365 575 L 378 480 Z"/>
      </clipPath>
    </defs>

    <!-- Broad feasible polygon, analogous to the shaded region in the reference. -->
    <path d="M 410 500 L 535 557 L 535 610 L 410 610 Z"
          fill="#F0440B" fill-opacity="0.28"/>

    <!-- Contour arcs centered outside the feasible region and entering from the left. -->
    <g clip-path="url(#ipm-interior-clip)" fill="none" stroke="#FFFFFF"
       stroke-width="2.75" stroke-opacity="0.95">
      <ellipse cx="382" cy="490" rx="15" ry="10" transform="rotate(-20 382 490)"/>
      <ellipse cx="382" cy="490" rx="29" ry="19" transform="rotate(-20 382 490)"/>
      <ellipse cx="382" cy="490" rx="44" ry="29" transform="rotate(-20 382 490)"/>
      <ellipse cx="382" cy="490" rx="61" ry="40" transform="rotate(-20 382 490)"/>
    </g>

    <!-- Multiple straight constraint cuts matching the reference composition. -->
    <g clip-path="url(#ipm-interior-clip)" fill="none" stroke="#F0440B"
       stroke-width="2.75" stroke-linecap="round">
      <path d="M 380 486 L 535 557"/>
      <path d="M 410 455 L 410 610"/>
      <path d="M 448 430 L 535 603"/>
      <path d="M 380 548 L 535 515"/>
    </g>

    <!-- Small discrete IPM iterates curving upward-left to the active boundary. -->
    <g fill="#0D0D0D" stroke="#F0440B" stroke-width="2.5">
      <circle cx="474" cy="581" r="3.7"/>
      <circle cx="468" cy="569" r="3.5"/>
      <circle cx="461" cy="557" r="3.3"/>
      <circle cx="453" cy="545" r="3.1"/>
      <circle cx="444" cy="534" r="2.9"/>
      <circle cx="435" cy="524" r="2.7"/>
      <circle cx="426" cy="515" r="2.5"/>
      <circle cx="418" cy="507" r="2.3"/>
    </g>

    <!-- Constrained optimum at the upper-left corner of the feasible region. -->
    <circle cx="410" cy="500" r="7" fill="#F0440B" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="410" cy="500" r="2" fill="#FFFFFF"/>
  </g>
</g>
</svg>
