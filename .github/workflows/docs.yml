name: Deploy docs

on:
  # main rebuilds the dev/ docs. A release additionally needs the versioned
  # site rebuilt (new archive entry + stable pointer) — but GitHub Pages only
  # *serves* deployments from the source branch (main), so a tag-triggered run
  # reports success yet never publishes (docs-deploy postmortem, 0.6.0). So
  # instead of `tags: ['v*']` we ride `workflow_run` after the crates release:
  # that event runs in the default-branch (main) context, so it deploys from
  # main (and therefore actually publishes), and by the time it fires the new
  # vX.Y.Z tag already exists, so build-versioned-docs.sh picks it up as stable.
  push:
    branches: [main]
  workflow_run:
    workflows: ["release-crates"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin mdBook so archived-tag rebuilds are reproducible and the inline
  # `path_to_root` the selector injection relies on stays stable. Matches the
  # version used locally to author scripts/build-versioned-docs.sh.
  MDBOOK_VERSION: "0.5.2"

jobs:
  build:
    runs-on: ubuntu-latest
    # On the release (workflow_run) trigger, only rebuild if the release
    # actually succeeded; push/dispatch runs are unconditional. `deploy` needs
    # `build`, so skipping here skips the deploy too.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # fetch-depth: 0 — the versioned build checks out each v* tag via
      # `git worktree`, so the full tag history must be present (the default
      # shallow clone has none).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install mdbook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: ${{ env.MDBOOK_VERSION }}

      # Builds stable (latest tag) -> site root, main -> site/dev/, and each
      # v* tag -> site/<tag>/, then injects the version selector into every
      # page. Strict: any version failing to build fails the job, so the last
      # good site stays live.
      - name: Build versioned site
        run: scripts/build-versioned-docs.sh "$GITHUB_WORKSPACE/site"

      # The in-browser solver (docs/src/wasm.md) rides the same Pages
      # deployment, at <site>/demo/. It is version-independent — one live
      # demo built from main, not one per archived tag — so it is staged
      # here rather than inside build-versioned-docs.sh, which wipes and
      # rebuilds its output directory per version.
      #
      # Nothing about it needs special Pages configuration: no threads, so
      # no SharedArrayBuffer and no COOP/COEP headers (which Pages cannot
      # set anyway), and every URL the page fetches is relative, so it works
      # under the /pounce/ base path unchanged.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Build the in-browser solver demo
        run: crates/pounce-wasm/build.sh
      - name: Stage the demo into the site
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site/demo"
          cp -a crates/pounce-wasm/web/. "$GITHUB_WORKSPACE/site/demo/"
          rm -f "$GITHUB_WORKSPACE/site/demo/.gitignore"
          test -s "$GITHUB_WORKSPACE/site/demo/pounce.wasm"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
