# Detached from the pounce workspace on purpose: the adversary harness is
# test scaffolding, not a shipped crate, and must never appear in a
# `cargo build --workspace` / publish list.
[workspace]

[package]
name = "adversary-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
pounce-qp = { path = "../../crates/pounce-qp" }
pounce-feral = { path = "../../crates/pounce-feral" }
pounce-common = { path = "../../crates/pounce-common" }
pounce-linalg = { path = "../../crates/pounce-linalg" }
pounce-cinterface = { path = "../../crates/pounce-cinterface" }
pounce-presolve = { path = "../../crates/pounce-presolve" }
pounce-nlp = { path = "../../crates/pounce-nlp" }

[profile.release]
debug = true
